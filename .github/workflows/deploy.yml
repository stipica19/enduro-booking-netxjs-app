name: Build & Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/stipica19/enduro-booking-netxjs-app:latest
          build-args: |
            NODE_OPTIONS=--max-old-space-size=2048
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u stipica19 --password-stdin

            docker pull ghcr.io/stipica19/enduro-booking-netxjs-app:latest

            docker network create app-network 2>/dev/null || true

            docker stop enduro-app 2>/dev/null || true
            docker rm enduro-app 2>/dev/null || true

            docker run -d \
              --name enduro-app \
              --restart unless-stopped \
              --network app-network \
              -p 3000:3000 \
              --memory="384m" \
              --cpus="0.5" \
              --dns 8.8.8.8 \
              --dns 8.8.4.4 \
              --env-file /root/.env \
              ghcr.io/stipica19/enduro-booking-netxjs-app:latest

            docker image prune -f
