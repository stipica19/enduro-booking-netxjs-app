name: Build & Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout koda
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login na GitHub Container Registry (besplatno, bez Docker Hub)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup Docker Buildx
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build i push Docker image na GHCR
      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            NODE_OPTIONS=--max-old-space-size=2048
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SSH na VPS - pull image i restart container
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Login na GHCR sa servera
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull najnoviji image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop i ukloni stari container
            docker stop enduro-app || true
            docker rm enduro-app || true

            # Pokretanje novog container-a sa env fajlom sa servera
            docker run -d \
              --name enduro-app \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/.env \
              ghcr.io/${{ github.repository }}:latest

            # Čišćenje starih image-a (oslobađanje diska)
            docker image prune -f
